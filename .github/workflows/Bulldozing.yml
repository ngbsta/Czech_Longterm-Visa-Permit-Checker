name: Bulldozer Pro

on:
  schedule:
    # Work every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'

  # Run Manual
  workflow_dispatch:

jobs:
  Bulldozer_Pro_on_Action:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📚 Install Python dependencies
      run: pip install --quiet selenium requests

    - name: ▶️ Run Visa Tracker
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        echo "========================================"
        echo " Starting Bulldozer Pro"
        echo "========================================"
        python bulldozer_pro.py
        echo "========================================"
        echo "✓ Bulldozer Pro Completed"
        echo "========================================"
